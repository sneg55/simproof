name: simproof

services:
  web:
    image: simproof-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    environment:
      SIMPROOF_ORCHESTRATOR_URL: http://orchestrator:3000
      SIMPROOF_MAX_REQUEST_BYTES: ${SIMPROOF_MAX_REQUEST_BYTES:-65536}
    networks: [edge, application]
    ports:
      - "127.0.0.1:${SIMPROOF_HTTP_PORT:-8080}:8080"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  orchestrator:
    image: simproof-orchestrator:local
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /tmp/simproof-codex:rw,noexec,nosuid,nodev,size=128m,mode=700,uid=65532,gid=65532
    environment:
      - NODE_ENV=production
      - SIMPROOF_DEPLOYMENT_MODE=${SIMPROOF_DEPLOYMENT_MODE:-loopback}
      - SIMPROOF_LISTEN_HOST=0.0.0.0
      - SIMPROOF_PORT=3000
      - SIMPROOF_DATABASE_PATH=/var/lib/simproof/current/metadata.sqlite
      - SIMPROOF_ARTIFACT_ROOT=/var/lib/simproof/current/artifacts
      - SIMPROOF_DIAGNOSTIC_LOG_ROOT=/var/log/simproof
      - SIMPROOF_DIAGNOSTIC_LOG_MAX_BYTES=${SIMPROOF_DIAGNOSTIC_LOG_MAX_BYTES:-8388608}
      - SIMPROOF_DIAGNOSTIC_LOG_FILES=${SIMPROOF_DIAGNOSTIC_LOG_FILES:-3}
      - SIMPROOF_ADMIN_BOOTSTRAP_SECRET=${SIMPROOF_ADMIN_BOOTSTRAP_SECRET:?set the bootstrap secret}
      - SIMPROOF_SESSION_SECRET=${SIMPROOF_SESSION_SECRET:?set the session secret}
      - SIMPROOF_SESSION_TTL_SECONDS=${SIMPROOF_SESSION_TTL_SECONDS:-28800}
      - SIMPROOF_SESSION_IDLE_SECONDS=${SIMPROOF_SESSION_IDLE_SECONDS:-3600}
      - SIMPROOF_MAX_ACTIVE_SESSIONS=${SIMPROOF_MAX_ACTIVE_SESSIONS:-8}
      - SIMPROOF_MAX_REQUEST_BYTES=${SIMPROOF_MAX_REQUEST_BYTES:-65536}
      - SIMPROOF_MAX_PROMPT_CHARACTERS=${SIMPROOF_MAX_PROMPT_CHARACTERS:-16384}
      - SIMPROOF_ALLOWED_ORIGINS=${SIMPROOF_ALLOWED_ORIGINS:-http://127.0.0.1:8080}
      - SIMPROOF_RUNNER_ENDPOINT=http://runner-launcher:4318
      - SIMPROOF_RUNNER_TOKEN=${SIMPROOF_RUNNER_TOKEN:?set the launcher token}
      - SIMPROOF_RUNNER_IMAGE=${SIMPROOF_RUNNER_IMAGE:?set an immutable runner image reference}
      - SIMPROOF_RUNNER_VERSION=${SIMPROOF_RUNNER_VERSION:-1.0.0}
      - SIMPROOF_PROMPT_RETENTION=${SIMPROOF_PROMPT_RETENTION:-discard}
      - SIMPROOF_TELEMETRY_ENABLED=false
      - SIMPROOF_EXTERNAL_DIAGNOSTICS_ENABLED=false
      - OPENAI_API_KEY
      - CODEX_API_KEY
      - SIMPROOF_OPENAI_MODEL
      - SIMPROOF_CODEX_MODEL
      - SIMPROOF_OPENAI_INPUT_PRICE_MICROUSD_PER_MILLION
      - SIMPROOF_OPENAI_OUTPUT_PRICE_MICROUSD_PER_MILLION
      - SIMPROOF_CODEX_INPUT_PRICE_MICROUSD_PER_MILLION
      - SIMPROOF_CODEX_OUTPUT_PRICE_MICROUSD_PER_MILLION
      - SIMPROOF_CODEX_WORKSPACE_ROOT
      - SIMPROOF_CODEX_STATE_ROOT
    volumes:
      - simproof-data:/var/lib/simproof
      - simproof-logs:/var/log/simproof
    networks: [application, runner-control, provider-egress]
    depends_on:
      runner-launcher:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  runner-launcher:
    image: simproof-launcher:local
    build:
      context: .
      dockerfile: Dockerfile.launcher
    user: "65532:65532"
    group_add:
      - "${SIMPROOF_DOCKER_GID:?set the Docker socket group ID}"
    read_only: true
    mem_limit: 256m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    environment:
      SIMPROOF_LAUNCHER_HOST: 0.0.0.0
      SIMPROOF_LAUNCHER_PORT: "4318"
      SIMPROOF_LAUNCHER_MAX_CONCURRENT: ${SIMPROOF_LAUNCHER_MAX_CONCURRENT:-2}
      SIMPROOF_LAUNCHER_MAX_REQUEST_BYTES: ${SIMPROOF_LAUNCHER_MAX_REQUEST_BYTES:-1048576}
      SIMPROOF_RUNNER_IMAGE: ${SIMPROOF_RUNNER_IMAGE:?set an immutable runner image reference}
      SIMPROOF_RUNNER_TOKEN: ${SIMPROOF_RUNNER_TOKEN:?set the launcher token}
    volumes:
      - ${SIMPROOF_DOCKER_SOCKET:?set the Docker socket path}:/var/run/docker.sock:ro
    networks: [runner-control]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4318/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  runner:
    image: simproof-runner:local
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    profiles: [image-only]
    user: "65532:65532"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=32m,mode=700

networks:
  edge: {}
  application:
    internal: true
  runner-control:
    internal: true
  provider-egress: {}

volumes:
  simproof-data: {}
  simproof-logs: {}
