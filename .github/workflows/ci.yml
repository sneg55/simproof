name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      OPENAI_API_KEY: ""
      CODEX_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enable ARM64 runner security tests
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          check-latest: false

      - name: Enable the locked pnpm release
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the content-addressed pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser used by educator gates
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the authoritative repository gate
        run: pnpm check

      - name: Run educator browser journeys
        run: pnpm test:e2e

      - name: Run educator accessibility gate
        run: pnpm test:a11y

      - name: Validate the isolated runner image definition
        run: docker build --check --file apps/runner/Dockerfile .

      # Raw logs and generated candidates are intentionally not uploaded. Any future
      # artifact upload must consume an explicitly redacted, bounded allowlist.
